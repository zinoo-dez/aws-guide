<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | AWS Architecture Guide</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #080C14;
        --card-bg: rgba(15, 23, 42, 0.85);
        --text: #F8FAFC;
        --text-muted: #94A3B8;
        --orange: #FF9900;
        --border: rgba(255, 255, 255, 0.1);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      body {
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .offline-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 40px 32px;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(16px);
      }
      .icon-box {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        background: rgba(255, 153, 0, 0.1);
        border: 1px solid rgba(255, 153, 0, 0.3);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
      p { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
      .actions { display: flex; flex-direction: column; gap: 12px; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background: linear-gradient(135deg, #FF9900, #FF6600);
        color: #000;
        border: none;
      }
      .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <div class="icon-box">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#FF9900" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>Offline Mode Active</h1>
      <p>
        You are currently browsing offline. Previously visited AWS architecture case studies and modules remain accessible from your local cache.
      </p>
      <div class="actions">
        <button class="btn btn-primary" onclick="window.location.reload()">
          Retry Connection
        </button>
        <a href="/" class="btn btn-secondary">
          Return to Cached Home
        </a>
      </div>
    </div>
  </body>
</html>
